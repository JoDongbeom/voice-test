<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 음성 테스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    background: #f4f5f7; color: #111;
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 4px 0 16px; }
  button, .btn {
    display: block; width: 100%;
    font-size: 1.3rem; font-weight: 700;
    padding: 20px; margin: 0 0 12px;
    border: none; border-radius: 14px;
    background: #2563eb; color: #fff;
    text-align: center; cursor: pointer;
  }
  button:active, .btn:active { opacity: .8; }
  button:disabled { opacity: .5; }
  .gray { background: #4b5563; }
  .red { background: #dc2626; }
  .green { background: #059669; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  #status {
    font-size: 1.6rem; font-weight: 800;
    padding: 16px; margin: 4px 0 12px;
    border-radius: 14px; background: #fff; text-align: center;
    border: 3px solid #d1d5db;
  }
  #status.error { color: #b91c1c; border-color: #fca5a5; font-size: 1.2rem; }
  #voiceWarn { color: #b45309; font-weight: 700; margin: 0 0 12px; }
  #answer {
    min-height: 120px; padding: 16px; margin-bottom: 12px;
    background: #fff; border-radius: 14px; border: 1px solid #d1d5db;
    font-size: 1.15rem; line-height: 1.6; white-space: pre-wrap;
  }
  .box { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #d1d5db; }
  label { font-weight: 700; display: block; margin-bottom: 8px; font-size: 1.1rem; }
  input[type=range] { width: 100%; height: 40px; }
  input[type=password] {
    width: 100%; font-size: 1.1rem; padding: 14px;
    border-radius: 10px; border: 1px solid #9ca3af; margin-bottom: 12px;
  }
  #keyState { margin: 0 0 12px; font-weight: 700; }
  #fileInput { display: none; }
</style>
</head>
<body>

<h1>📷 사진 → AI → 🎧 음성 테스트</h1>

<button id="btnVoiceTest" class="green">🔊 음성 테스트</button>

<label for="fileInput" id="btnCamera" class="btn">📷 사진 찍고 듣기</label>
<input id="fileInput" type="file" accept="image/*" capture="environment">

<div id="status">대기</div>
<p id="voiceWarn" hidden></p>

<div id="answer">답변이 여기에 표시됩니다.</div>

<div class="row">
  <button id="btnReplay" class="gray">🔁 다시 듣기</button>
  <button id="btnStop" class="red">⏹ 멈춤</button>
</div>

<div class="box">
  <label for="rate">읽기 속도: <span id="rateVal">0.8</span></label>
  <input id="rate" type="range" min="0.5" max="1.5" step="0.1" value="0.8">
</div>

<div class="box">
  <label for="apiKey">OpenAI API 키</label>
  <p id="keyState"></p>
  <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." spellcheck="false">
  <div class="row">
    <button id="btnSaveKey">저장</button>
    <button id="btnClearKey" class="red">키 지우기</button>
  </div>
</div>

<script>
// ===== 설정 (여기만 바꾸면 됨) =====
const MODEL = "gpt-6-sol";       // 더 싸게: "gpt-5.4-mini", "gpt-6-luna"
const REASONING_EFFORT = "medium"; // none / low / medium / high (높을수록 정확하지만 느림)
const SYSTEM_PROMPT = [
  "너는 한국 국가공무원 5급 공채 2차 시험 채점 기준에 맞춰 모범답안을 쓰는 전문가다.",
  "사진 속 문제를 정확히 읽고, 계산은 반드시 검산한 뒤 답안을 작성하라.",
  "",
  "형식 규칙:",
  "대목차는 Ⅰ. Ⅱ. Ⅲ. 으로, 중목차는 1. 2. 3. 으로, 세부 항목은 줄 맨 앞에 * 를 붙인다.",
  "조건을 나눌 때는 ① ② ③ 을 쓴다.",
  "한 줄에는 한 가지 내용만 쓰고, 문장은 '~임', '~함' 같은 개조식으로 짧게 쓴다.",
  "수식은 한 줄에 쓰고 사용할 수 있는 기호는 = ≤ ≥ < > ≈ → ⇔ + − × / √ ² ( ) 뿐이다.",
  "분수는 a/b, 아래첨자는 U_A 처럼 쓴다. LaTeX, 마크다운(#, **, 표), 이모지는 절대 쓰지 마라.",
  "",
  "구성: Ⅰ. 문제의 소재(핵심 개념) → 물음별 풀이(각 물음마다 대목차) → 마지막에 결론과 경제학적 의미.",
  "",
  "사진이 시험 문제가 아니면 같은 형식으로 사진 내용을 설명하라.",
  "글자를 읽을 수 없으면 '사진이 흐립니다. 다시 찍어 주세요.' 한 줄만 답하라.",
].join("\n");
const USER_PROMPT = "이 사진 속 문제를 풀어서 모범답안을 작성해줘.";
const MAX_OUTPUT_TOKENS = 16000; // 추론(생각) 토큰 포함
const TIMEOUT_MS = 180000;       // 3분
const MAX_SIDE = 2048;           // 시험지 글자를 잘 읽도록 크게
const JPEG_QUALITY = 0.8;
const TEST_TEXT = "블루투스 이어폰 음성 테스트입니다. 잘 들리시나요?";
const KEY_STORAGE = "openai_api_key";
const RATE_STORAGE = "speech_rate";
// ===================================

const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const answerEl = $("answer");
const rateEl = $("rate");
let lastAnswer = "";
let koVoice = null;

// ---------- 상태 표시 ----------
function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

// ---------- localStorage (예외 안전) ----------
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

// ---------- 음성 ----------
const synth = window.speechSynthesis;

function pickKoreanVoice() {
  if (!synth) return;
  const voices = synth.getVoices();
  if (!voices.length) return; // 아직 로드 전
  koVoice =
    voices.find(v => v.lang === "ko-KR" && v.localService) ||
    voices.find(v => v.lang === "ko-KR") ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ko")) ||
    null;
  const warn = $("voiceWarn");
  if (!koVoice) {
    warn.hidden = false;
    warn.textContent = "⚠ 이 기기에 한국어 음성이 없습니다. 설정 > 텍스트 음성 변환(TTS)에서 한국어 음성 데이터를 설치하세요.";
  } else {
    warn.hidden = true;
  }
}

if (!synth) {
  $("voiceWarn").hidden = false;
  $("voiceWarn").textContent = "⚠ 이 브라우저는 음성 읽기(speechSynthesis)를 지원하지 않습니다.";
} else {
  pickKoreanVoice();
  synth.onvoiceschanged = pickKoreanVoice;
}

// 버튼 탭 직후 호출: 빈 발화로 음성 엔진을 깨워둠 (모바일 자동재생 제한 대응)
function unlockSpeech() {
  if (!synth) return;
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    u.lang = "ko-KR";
    synth.speak(u);
  } catch {}
}

// ----- 기호 → 읽는 말 -----
const ROMAN = { "Ⅰ":"일","Ⅱ":"이","Ⅲ":"삼","Ⅳ":"사","Ⅴ":"오","Ⅵ":"육","Ⅶ":"칠","Ⅷ":"팔","Ⅸ":"구","Ⅹ":"십" };
const CIRCLED = { "①":"일","②":"이","③":"삼","④":"사","⑤":"오","⑥":"육","⑦":"칠","⑧":"팔","⑨":"구","⑩":"십" };
const BULLET_WORD = "점";   // 줄 앞 * 를 읽는 말

// 한 줄을 소리 내 읽기 좋은 문장으로 바꿈 (화면 표시는 원문 그대로)
function toSpeakable(line) {
  let s = line.trim();
  // 줄 맨 앞 기호
  s = s.replace(/^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ])\.?\s*/, (_, r) => "로마자 " + ROMAN[r] + ", ");
  s = s.replace(/^(\d+)\.(?!\d)\s*/, "$1번, ");
  s = s.replace(/^[*•·\-]\s*/, BULLET_WORD + ", ");
  // 문장 속 기호
  s = s.replace(/[①-⑩]/g, (c) => " 동그라미 " + CIRCLED[c] + ", ");
  s = s.replace(/(\d),(?=\d{3})/g, "$1");          // 500,000 → 500000
  s = s.replace(/[甲乙丙丁]/g, (c) => ({ "甲":"갑","乙":"을","丙":"병","丁":"정" })[c]);
  const words = [
    ["⇔", " 동치, "], ["→", ", 그러므로 "], ["≈", " 약 "],
    ["≤", " 작거나 같다 "], ["≥", " 크거나 같다 "], ["<", " 작다 "], [">", " 크다 "],
    ["=", " 는 "], ["×", " 곱하기 "], ["+", " 더하기 "], ["−", " 빼기 "], [" - ", " 빼기 "],
    ["√", " 루트 "], ["²", " 제곱 "], ["/", " 나누기 "], ["_", " "], ["~", " 에서 "],
    ["(", ", "], [")", ", "],
  ];
  for (const [from, to] of words) s = s.split(from).join(to);
  return s.replace(/\s*,\s*(,\s*)+/g, ", ").replace(/\s+,/g, ",").replace(/\s+/g, " ").replace(/^,\s*|,\s*$/g, "").trim();
}

// 줄 단위로 읽기 (줄바꿈 = 잠깐 쉼). 긴 줄은 문장/쉼표 기준으로 다시 나눔 (안드로이드 끊김 방지)
function splitSentences(text) {
  const parts = text
    .split(/\n+/)
    .map(toSpeakable)
    .flatMap(line => line.split(/(?<=[.!?。？！])\s+/))
    .map(s => s.trim())
    .filter(Boolean);
  // 너무 긴 문장은 쉼표 기준으로 한 번 더 나눔
  const out = [];
  for (const p of parts) {
    if (p.length <= 120) { out.push(p); continue; }
    let buf = "";
    for (const piece of p.split(/(?<=,)\s*/)) {
      if ((buf + piece).length > 120 && buf) { out.push(buf); buf = ""; }
      buf += (buf ? " " : "") + piece;
    }
    if (buf) out.push(buf);
  }
  return out;
}

let speakToken = 0;

function speak(text, { onDone } = {}) {
  if (!synth) return;
  synth.cancel();
  const myToken = ++speakToken;
  const sentences = splitSentences(text);
  let i = 0;

  const next = () => {
    if (myToken !== speakToken) return;          // 멈춤/새 재생으로 취소됨
    if (i >= sentences.length) { onDone && onDone(); return; }
    const u = new SpeechSynthesisUtterance(sentences[i++]);
    u.lang = "ko-KR";
    if (koVoice) u.voice = koVoice;
    u.rate = parseFloat(rateEl.value);
    u.onend = next;
    u.onerror = (e) => {
      if (e.error === "interrupted" || e.error === "canceled") return;
      next();
    };
    synth.speak(u);
  };
  // cancel 직후 바로 speak 하면 일부 기기에서 무시되므로 약간 지연
  setTimeout(next, 80);
}

function stopSpeech() {
  speakToken++;
  if (synth) synth.cancel();
}

// ---------- 속도 슬라이더 ----------
const savedRate = parseFloat(lsGet(RATE_STORAGE));
if (savedRate >= 0.5 && savedRate <= 1.5) rateEl.value = savedRate;
$("rateVal").textContent = parseFloat(rateEl.value).toFixed(1);
rateEl.addEventListener("input", () => {
  $("rateVal").textContent = parseFloat(rateEl.value).toFixed(1);
  lsSet(RATE_STORAGE, rateEl.value);
});

// ---------- API 키 ----------
function getKey() { return (lsGet(KEY_STORAGE) || "").trim(); }
function refreshKeyState() {
  $("keyState").textContent = getKey() ? "✅ 키가 이 폰에 저장되어 있습니다." : "❌ 저장된 키가 없습니다.";
}
refreshKeyState();

$("btnSaveKey").addEventListener("click", () => {
  const v = $("apiKey").value.trim();
  if (!v) { setStatus("키를 입력하세요", true); return; }
  lsSet(KEY_STORAGE, v);
  $("apiKey").value = "";
  refreshKeyState();
  setStatus("키 저장됨");
});

$("btnClearKey").addEventListener("click", () => {
  lsDel(KEY_STORAGE);
  $("apiKey").value = "";
  refreshKeyState();
  setStatus("키 삭제됨");
});

// ---------- 오류 안내 (화면 + 음성) ----------
function reportError(screenMsg, voiceMsg) {
  setStatus("오류: " + screenMsg, true);
  speak(voiceMsg || screenMsg, { onDone: () => {} });
}

// ---------- 버튼: 음성 테스트 ----------
$("btnVoiceTest").addEventListener("click", () => {
  unlockSpeech();
  setStatus("읽는 중");
  speak(TEST_TEXT, { onDone: () => setStatus("대기") });
});

// ---------- 버튼: 다시 듣기 / 멈춤 ----------
$("btnReplay").addEventListener("click", () => {
  unlockSpeech();
  if (!lastAnswer) { setStatus("아직 답변이 없습니다", true); return; }
  setStatus("읽는 중");
  speak(lastAnswer, { onDone: () => setStatus("대기") });
});

$("btnStop").addEventListener("click", () => {
  stopSpeech();
  setStatus("대기");
});

// ---------- 버튼: 사진 찍고 듣기 ----------
// label 탭 시점에 음성 엔진을 깨움 (카메라에서 돌아온 뒤엔 사용자 제스처가 아님)
$("btnCamera").addEventListener("click", unlockSpeech);

$("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = ""; // 같은 사진 다시 선택 가능하도록
  if (!file) return;

  const key = getKey();
  if (!key) {
    reportError("API 키가 없습니다. 맨 아래에 키를 저장하세요.", "API 키가 없습니다. 화면 맨 아래에 키를 입력해 주세요.");
    return;
  }

  try {
    setStatus("사진 처리 중");
    stopSpeech();
    const dataUrl = await resizeToDataUrl(file);

    setStatus("AI 분석 중 (1~2분)");
    answerEl.textContent = "…";
    const text = await askOpenAI(key, dataUrl);

    lastAnswer = text;
    answerEl.textContent = text;
    setStatus("읽는 중");
    speak(text, { onDone: () => setStatus("대기") });
  } catch (err) {
    answerEl.textContent = "";
    const m = describeError(err);
    reportError(m.screen, m.voice);
  }
});

// ---------- 이미지 축소 ----------
function resizeToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let { width: w, height: h } = img;
        const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
      } catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("IMAGE_LOAD")); };
    img.src = url;
  });
}

// ---------- OpenAI 호출 (Responses API) ----------
async function askOpenAI(key, dataUrl) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  let res;
  try {
    res = await fetch("https://api.openai.com/v1/responses", {
      method: "POST",
      signal: controller.signal,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key,
      },
      body: JSON.stringify({
        model: MODEL,
        instructions: SYSTEM_PROMPT,
        max_output_tokens: MAX_OUTPUT_TOKENS,
        reasoning: { effort: REASONING_EFFORT },
        store: false,
        input: [{
          role: "user",
          content: [
            { type: "input_text", text: USER_PROMPT },
            { type: "input_image", image_url: dataUrl, detail: "high" },
          ],
        }],
      }),
    });
  } finally {
    clearTimeout(timer);
  }

  if (!res.ok) {
    let apiMsg = "";
    try { apiMsg = (await res.json())?.error?.message || ""; } catch {}
    const err = new Error("HTTP");
    err.status = res.status;
    err.apiMsg = apiMsg;
    throw err;
  }

  const data = await res.json();
  const text = extractText(data);
  if (!text) throw new Error("EMPTY");
  return text;
}

function extractText(data) {
  if (typeof data.output_text === "string" && data.output_text.trim()) return data.output_text.trim();
  const parts = [];
  for (const item of data.output || []) {
    if (item.type !== "message") continue;
    for (const c of item.content || []) {
      if (c.type === "output_text" && c.text) parts.push(c.text);
    }
  }
  return parts.join(" ").trim();
}

function describeError(err) {
  if (err.name === "AbortError")
    return { screen: "시간 초과 (" + TIMEOUT_MS / 1000 + "초)", voice: "응답 시간이 초과되었습니다. 다시 시도해 주세요." };
  if (err.message === "IMAGE_LOAD")
    return { screen: "사진을 읽을 수 없습니다", voice: "사진을 읽을 수 없습니다. 다시 찍어 주세요." };
  if (err.message === "EMPTY")
    return { screen: "AI 답변이 비어 있습니다", voice: "답변을 받지 못했습니다. 다시 시도해 주세요." };
  if (err.status === 401)
    return { screen: "401 인증 실패 - API 키를 확인하세요", voice: "API 키가 올바르지 않습니다. 키를 다시 확인해 주세요." };
  if (err.status === 429)
    return { screen: "429 요청 한도 초과 또는 잔액 부족" + (err.apiMsg ? "\n" + err.apiMsg : ""), voice: "요청 한도를 초과했거나 잔액이 부족합니다." };
  if (err.status)
    return { screen: "서버 오류 " + err.status + (err.apiMsg ? "\n" + err.apiMsg : ""), voice: "서버 오류가 발생했습니다." };
  // fetch 자체 실패 (TypeError) = 네트워크
  return { screen: "네트워크 오류 - 인터넷 연결을 확인하세요", voice: "네트워크 오류입니다. 인터넷 연결을 확인해 주세요." };
}
</script>
</body>
</html>
