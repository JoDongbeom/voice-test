<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사진 음성 테스트</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: system-ui, -apple-system, "Noto Sans KR", sans-serif;
    background: #f4f5f7; color: #111;
    max-width: 560px; margin-inline: auto;
  }
  h1 { font-size: 1.3rem; margin: 4px 0 16px; }
  button, .btn {
    display: block; width: 100%;
    font-size: 1.3rem; font-weight: 700;
    padding: 20px; margin: 0 0 12px;
    border: none; border-radius: 14px;
    background: #2563eb; color: #fff;
    text-align: center; cursor: pointer;
  }
  button:active, .btn:active { opacity: .8; }
  button:disabled { opacity: .5; }
  .gray { background: #4b5563; }
  .red { background: #dc2626; }
  .green { background: #059669; }
  .row { display: flex; gap: 12px; }
  .row > * { flex: 1; }
  #status {
    font-size: 1.6rem; font-weight: 800;
    padding: 16px; margin: 4px 0 12px;
    border-radius: 14px; background: #fff; text-align: center;
    border: 3px solid #d1d5db;
  }
  #status.error { color: #b91c1c; border-color: #fca5a5; font-size: 1.2rem; }
  #voiceWarn { color: #b45309; font-weight: 700; margin: 0 0 12px; white-space: pre-line; }
  #answer {
    min-height: 120px; padding: 16px; margin-bottom: 12px;
    background: #fff; border-radius: 14px; border: 1px solid #d1d5db;
    font-size: 1.15rem; line-height: 1.6; white-space: pre-wrap;
  }
  .box { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px; border: 1px solid #d1d5db; }
  label { font-weight: 700; display: block; margin-bottom: 8px; font-size: 1.1rem; }
  input[type=range] { width: 100%; height: 40px; }
  input[type=password] {
    width: 100%; font-size: 1.1rem; padding: 14px;
    border-radius: 10px; border: 1px solid #9ca3af; margin-bottom: 12px;
  }
  #keyState { margin: 0 0 12px; font-weight: 700; }
  #fileInput { display: none; }
  .player .row { gap: 8px; }
  .player .row button { padding: 20px 4px; font-size: 1.1rem; }
  .player .row .play { flex: 1.4; background: #2563eb; }
</style>
</head>
<body>

<h1>📷 사진 → AI → 🎧 음성 테스트</h1>

<button id="btnVoiceTest" class="green">🔊 음성 테스트</button>

<label for="fileInput" id="btnCamera" class="btn">📷 사진 찍고 듣기</label>
<input id="fileInput" type="file" accept="image/*" capture="environment">

<div id="status">대기</div>
<p id="voiceWarn" hidden></p>

<div id="answer">답변이 여기에 표시됩니다.</div>

<div class="player">
  <div class="row">
    <button id="btnPrevSection" class="gray">⏪ 이전 목차</button>
    <button id="btnNextSection" class="gray">다음 목차 ⏩</button>
  </div>
  <div class="row">
    <button id="btnPrevLine" class="gray">◀ 이전 줄</button>
    <button id="btnPlay" class="play">▶ 재생</button>
    <button id="btnNextLine" class="gray">다음 줄 ▶</button>
  </div>
  <button id="btnReplay" class="gray">🔁 처음부터</button>
</div>

<div class="box">
  <label for="rate">읽기 속도: <span id="rateVal">0.8</span></label>
  <input id="rate" type="range" min="0.1" max="1.5" step="0.1" value="0.8">
</div>

<div class="box">
  <label for="apiKey">OpenAI API 키</label>
  <p id="keyState"></p>
  <input id="apiKey" type="password" autocomplete="off" placeholder="sk-..." spellcheck="false">
  <div class="row">
    <button id="btnSaveKey">저장</button>
    <button id="btnClearKey" class="red">키 지우기</button>
  </div>
</div>

<script>
// ===== 설정 (여기만 바꾸면 됨) =====
const MODEL = "gpt-6-sol";       // 더 싸게: "gpt-5.4-mini", "gpt-6-luna"
const REASONING_EFFORT = "medium"; // none / low / medium / high (높을수록 정확하지만 느림)
const SYSTEM_PROMPT = [

  "뻔한 교과서 정의를 늘어놓지 말고, 이 문제의 숫자와 상황에 바로 연결해서 쓴다.",

  "물음 전체가 그래프 그리기뿐이면 그 물음은 '그래프 생략' 한 줄만 쓴다.",

  "사진에서 문제의 배점을 먼저 확인하고, 배점에 맞춰 공백 포함 글자 수를 맞춘다.",

  "그 밖의 배점은 이 비율에 맞춰 조절한다 (예: 10점은 1쪽, 약 600자).",
  "물음별 배점이 적혀 있으면 전체 분량을 물음별 배점 비율대로 나눠 쓴다.",
  "배점이 보이지 않으면 30점 기준(약 1,600자)으로 쓴다.",
  "분량을 채우려고 같은 말을 반복하지 말고, 모자라면 경제학적 의미와 계산 과정을 보강한다.",
  "",
  "사진이 시험 문제가 아니면 같은 형식으로 사진 내용을 설명하라.",
  "글자를 읽을 수 없으면 '사진이 흐립니다. 다시 찍어 주세요.' 한 줄만 답하라.",

const USER_PROMPT = "이 사진 속 문제를 풀어서 모범답안을 작성해줘.";
const MAX_OUTPUT_TOKENS = 16000; // 추론(생각) 토큰 포함
const TIMEOUT_MS = 180000;       // 3분
const MAX_SIDE = 2048;           // 시험지 글자를 잘 읽도록 크게
const JPEG_QUALITY = 0.8;
const TEST_TEXT = "블루투스 이어폰 음성 테스트입니다. 잘 들리시나요?";
const KEY_STORAGE = "openai_api_key";
const RATE_STORAGE = "speech_rate";
// ===================================

const $ = (id) => document.getElementById(id);
const statusEl = $("status");
const answerEl = $("answer");
const rateEl = $("rate");
let lastAnswer = "";
let koVoice = null;

// ---------- 상태 표시 ----------
function setStatus(text, isError = false) {
  statusEl.textContent = text;
  statusEl.classList.toggle("error", isError);
}

// ---------- localStorage (예외 안전) ----------
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch {} }

// ---------- 음성 ----------
const synth = window.speechSynthesis;

// 앱(안드로이드) 안에서 열리면 음성은 앱이 담당 (화면이 꺼져도 읽기 위해)
const nativeSpeech = () => window.AndroidSpeech || null;
let nativeSent = null; // 앱에 마지막으로 보낸 줄 목록 (같으면 다시 보내지 않음)

function pickKoreanVoice() {
  if (!synth) return;
  const voices = synth.getVoices();
  if (!voices.length) return; // 아직 로드 전
  koVoice =
    voices.find(v => v.lang === "ko-KR" && v.localService) ||
    voices.find(v => v.lang === "ko-KR") ||
    voices.find(v => v.lang && v.lang.toLowerCase().startsWith("ko")) ||
    null;
  const warn = $("voiceWarn");
  if (!koVoice) {
    warn.hidden = false;
    warn.textContent = "⚠ 이 기기에 한국어 음성이 없습니다. 설정 > 텍스트 음성 변환(TTS)에서 한국어 음성 데이터를 설치하세요.";
  } else {
    warn.hidden = true;
  }
}

if (nativeSpeech()) {
  // 한국어 음성 확인은 앱이 onNativeNotice 로 알려줌
} else if (!synth) {
  $("voiceWarn").hidden = false;
  $("voiceWarn").textContent = "⚠ 이 브라우저는 음성 읽기(speechSynthesis)를 지원하지 않습니다.";
} else {
  pickKoreanVoice();
  synth.onvoiceschanged = pickKoreanVoice;
}

// 버튼 탭 직후 호출: 빈 발화로 음성 엔진을 깨워둠 (모바일 자동재생 제한 대응)
function unlockSpeech() {
  if (nativeSpeech() || !synth || synth.speaking) return; // 앱이면 불필요, 읽는 중이면 끊지 않도록
  try {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    u.lang = "ko-KR";
    synth.speak(u);
  } catch {}
}

// ----- 기호 → 읽는 말 -----
const ROMAN = { "Ⅰ":"일","Ⅱ":"이","Ⅲ":"삼","Ⅳ":"사","Ⅴ":"오","Ⅵ":"육","Ⅶ":"칠","Ⅷ":"팔","Ⅸ":"구","Ⅹ":"십" };
const CIRCLED = { "①":"일","②":"이","③":"삼","④":"사","⑤":"오","⑥":"육","⑦":"칠","⑧":"팔","⑨":"구","⑩":"십" };
const BULLET_WORD = "점";   // 줄 앞 * 를 읽는 말

// 한 줄을 소리 내 읽기 좋은 문장으로 바꿈 (화면 표시는 원문 그대로)
function toSpeakable(line) {
  let s = line.trim();
  // 줄 맨 앞 기호
  s = s.replace(/^([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ])\.?\s*/, (_, r) => "로마자 " + ROMAN[r] + ", ");
  s = s.replace(/^(\d+)\.(?!\d)\s*/, "$1번, ");
  s = s.replace(/^[*•·\-]\s*/, BULLET_WORD + ", ");
  // 문장 속 기호
  s = s.replace(/[①-⑩]/g, (c) => " 동그라미 " + CIRCLED[c] + ", ");
  s = s.replace(/(\d),(?=\d{3})/g, "$1");          // 500,000 → 500000
  s = s.replace(/[甲乙丙丁]/g, (c) => ({ "甲":"갑","乙":"을","丙":"병","丁":"정" })[c]);
  const words = [
    ["⇔", " 동치, "], ["→", ", 그러므로 "], ["≈", " 약 "],
    ["∴", " 따라서 "], ["∵", " 왜냐하면 "], ["cf.", " 참고로 "],
    ["≤", " 작거나 같다 "], ["≥", " 크거나 같다 "], ["<", " 작다 "], [">", " 크다 "],
    ["=", " 는 "], ["×", " 곱하기 "], ["+", " 더하기 "], ["−", " 빼기 "], [" - ", " 빼기 "],
    ["√", " 루트 "], ["²", " 제곱 "], ["/", " 나누기 "], ["_", " "], ["~", " 에서 "],
    ["(", ", "], [")", ", "],
  ];
  for (const [from, to] of words) s = s.split(from).join(to);
  return s.replace(/\s*,\s*(,\s*)+/g, ", ").replace(/\s+,/g, ",").replace(/\s+/g, " ").replace(/^,\s*|,\s*$/g, "").trim();
}

// 한 줄을 읽기 조각으로 나눔. 긴 줄은 문장/쉼표 기준으로 다시 나눔 (안드로이드 끊김 방지)
function toChunks(line) {
  const parts = toSpeakable(line)
    .split(/(?<=[.!?。？！])\s+/)
    .map(s => s.trim())
    .filter(Boolean);
  const out = [];
  for (const p of parts) {
    if (p.length <= 120) { out.push(p); continue; }
    let buf = "";
    for (const piece of p.split(/(?<=,)\s*/)) {
      if ((buf + piece).length > 120 && buf) { out.push(buf); buf = ""; }
      buf += (buf ? " " : "") + piece;
    }
    if (buf) out.push(buf);
  }
  return out;
}

// ---------- 플레이어 (줄 단위 이동) ----------
// 줄 = 화면의 한 줄, 목차 = Ⅰ. Ⅱ. 로 시작하는 줄
const player = { lines: [], pos: 0, playing: false, token: 0, onDone: null, quiet: false };

function loadText(text, onDone, quiet) {
  player.lines = text.split(/\n+/)
    .map(l => l.trim())
    .filter(Boolean)
    .map(l => ({ chunks: toChunks(l), section: /^[ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ]/.test(l) }))
    .filter(l => l.chunks.length);
  player.text = text;
  player.pos = 0;
  player.onDone = onDone || null;
  player.quiet = !!quiet;          // 오류 안내처럼 상태 표시를 건드리면 안 되는 음성
}

function posLabel() {
  return player.lines.length ? " · " + (player.pos + 1) + "/" + player.lines.length + "줄" : "";
}

function updatePlayUI() {
  $("btnPlay").textContent = player.playing ? "⏸ 일시정지" : "▶ 재생";
  if (player.lines.length && !player.quiet) setStatus((player.playing ? "읽는 중" : "일시정지") + posLabel());
}

function playFrom(lineIdx) {
  const nat = nativeSpeech();
  if (nat) {
    if (!player.lines.length) return;
    if (nativeSent !== player.lines) {
      nat.load(JSON.stringify(player.lines), parseFloat(rateEl.value));
      nativeSent = player.lines;
    }
    nat.playFrom(Math.max(0, Math.min(lineIdx, player.lines.length - 1)));
    return; // 상태 표시는 onNativeSpeech 가 갱신
  }
  if (!synth || !player.lines.length) return;
  synth.cancel();
  const myToken = ++player.token;
  player.pos = Math.max(0, Math.min(lineIdx, player.lines.length - 1));
  player.playing = true;
  updatePlayUI();
  let chunk = 0;

  const next = () => {
    if (myToken !== player.token) return;          // 일시정지/이동으로 취소됨
    const line = player.lines[player.pos];
    if (chunk >= line.chunks.length) {             // 이 줄 끝 → 다음 줄
      if (player.pos + 1 >= player.lines.length) { // 전체 끝
        player.playing = false;
        $("btnPlay").textContent = "▶ 재생";
        player.pos = 0;                            // 다음 재생은 처음부터
        if (!player.quiet) setStatus("대기");
        player.onDone && player.onDone();
        return;
      }
      player.pos++;
      chunk = 0;
      updatePlayUI();
    }
    const u = new SpeechSynthesisUtterance(player.lines[player.pos].chunks[chunk++]);
    u.lang = "ko-KR";
    if (koVoice) u.voice = koVoice;
    u.rate = parseFloat(rateEl.value);
    u.onend = next;
    u.onerror = (e) => {
      if (e.error === "interrupted" || e.error === "canceled") return;
      next();
    };
    synth.speak(u);
  };
  // cancel 직후 바로 speak 하면 일부 기기에서 무시되므로 약간 지연
  setTimeout(next, 80);
}

// 일시정지 = 멈추고 위치 기억 (안드로이드는 pause()가 불안정해서 줄 처음부터 다시 읽음)
function pausePlayer() {
  const nat = nativeSpeech();
  if (nat) { nat.pause(); return; }
  player.token++;
  player.playing = false;
  if (synth) synth.cancel();
  updatePlayUI();
}

function speak(text, { onDone, quiet } = {}) {
  loadText(text, onDone, quiet);
  playFrom(0);
}

function stopSpeech() {
  pausePlayer();
}

function sectionStarts() {
  return player.lines.map((l, i) => l.section ? i : -1).filter(i => i >= 0);
}

// ---------- 앱이 보내는 상태 ----------
window.onNativeSpeech = (s) => {
  player.playing = s.state === "playing";
  if (typeof s.pos === "number") player.pos = s.pos;
  if (s.state === "ended") {
    $("btnPlay").textContent = "▶ 재생";
    if (!player.quiet) setStatus("대기");
    const done = player.onDone;
    player.onDone = null;
    if (done) done();
    return;
  }
  updatePlayUI();
  if (s.message && !player.quiet) setStatus(s.message + posLabel());
};

window.onNativeNotice = (text) => {
  const warn = $("voiceWarn");
  warn.textContent = warn.hidden || !warn.textContent ? text : warn.textContent + "\n" + text;
  warn.hidden = false;
};

// ---------- 속도 슬라이더 ----------
const savedRate = parseFloat(lsGet(RATE_STORAGE));
if (savedRate >= 0.1 && savedRate <= 1.5) rateEl.value = savedRate;
$("rateVal").textContent = parseFloat(rateEl.value).toFixed(1);
rateEl.addEventListener("input", () => {
  $("rateVal").textContent = parseFloat(rateEl.value).toFixed(1);
  lsSet(RATE_STORAGE, rateEl.value);
  const nat = nativeSpeech();
  if (nat) nat.setRate(parseFloat(rateEl.value));
});

// ---------- API 키 ----------
function getKey() { return (lsGet(KEY_STORAGE) || "").trim(); }
function refreshKeyState() {
  $("keyState").textContent = getKey() ? "✅ 키가 이 폰에 저장되어 있습니다." : "❌ 저장된 키가 없습니다.";
}
refreshKeyState();

$("btnSaveKey").addEventListener("click", () => {
  const v = $("apiKey").value.trim();
  if (!v) { setStatus("키를 입력하세요", true); return; }
  lsSet(KEY_STORAGE, v);
  $("apiKey").value = "";
  refreshKeyState();
  setStatus("키 저장됨");
});

$("btnClearKey").addEventListener("click", () => {
  lsDel(KEY_STORAGE);
  $("apiKey").value = "";
  refreshKeyState();
  setStatus("키 삭제됨");
});

// ---------- 오류 안내 (화면 + 음성) ----------
function reportError(screenMsg, voiceMsg) {
  setStatus("오류: " + screenMsg, true);
  speak(voiceMsg || screenMsg, { quiet: true });
}

// ---------- 버튼: 음성 테스트 ----------
$("btnVoiceTest").addEventListener("click", () => {
  unlockSpeech();
  setStatus("읽는 중");
  speak(TEST_TEXT, { onDone: () => setStatus("대기") });
});

// ---------- 버튼: 플레이어 조작 ----------
// 답변이 아닌 음성(테스트/오류)이 올라가 있으면 답변으로 다시 불러옴
function ensureAnswerLoaded() {
  if (!lastAnswer) { setStatus("아직 답변이 없습니다", true); return false; }
  if (player.quiet || player.text !== lastAnswer) loadText(lastAnswer);
  return true;
}

$("btnReplay").addEventListener("click", () => {
  unlockSpeech();
  if (!ensureAnswerLoaded()) return;
  playFrom(0);
});

$("btnPlay").addEventListener("click", () => {
  if (player.playing) { pausePlayer(); return; }
  unlockSpeech();
  if (!ensureAnswerLoaded()) return;
  playFrom(player.pos);
});

$("btnPrevLine").addEventListener("click", () => {
  unlockSpeech();
  if (!ensureAnswerLoaded()) return;
  playFrom(player.pos - 1);
});

$("btnNextLine").addEventListener("click", () => {
  unlockSpeech();
  if (!ensureAnswerLoaded()) return;
  if (player.pos + 1 >= player.lines.length) { setStatus("마지막 줄입니다" + posLabel()); return; }
  playFrom(player.pos + 1);
});

// 이전 목차: 목차 중간이면 그 목차 처음으로, 이미 목차 처음이면 앞 목차로 (음악 앱의 이전 곡과 같은 방식)
$("btnPrevSection").addEventListener("click", () => {
  unlockSpeech();
  if (!ensureAnswerLoaded()) return;
  const starts = sectionStarts();
  const cur = starts.filter(i => i <= player.pos).pop();
  if (cur === undefined) { playFrom(0); return; }
  if (cur < player.pos) { playFrom(cur); return; }
  const prev = starts.filter(i => i < cur).pop();
  playFrom(prev === undefined ? 0 : prev);
});

$("btnNextSection").addEventListener("click", () => {
  unlockSpeech();
  if (!ensureAnswerLoaded()) return;
  const nxt = sectionStarts().find(i => i > player.pos);
  if (nxt === undefined) { setStatus("마지막 목차입니다" + posLabel()); return; }
  playFrom(nxt);
});

// ---------- 버튼: 사진 찍고 듣기 ----------
// label 탭 시점에 음성 엔진을 깨움 (카메라에서 돌아온 뒤엔 사용자 제스처가 아님)
$("btnCamera").addEventListener("click", unlockSpeech);

$("fileInput").addEventListener("change", async (e) => {
  const file = e.target.files && e.target.files[0];
  e.target.value = ""; // 같은 사진 다시 선택 가능하도록
  if (!file) return;

  const key = getKey();
  if (!key) {
    reportError("API 키가 없습니다. 맨 아래에 키를 저장하세요.", "API 키가 없습니다. 화면 맨 아래에 키를 입력해 주세요.");
    return;
  }

  try {
    stopSpeech();
    setStatus("사진 처리 중");
    const dataUrl = await resizeToDataUrl(file);

    setStatus("AI 분석 중 (1~2분)");
    answerEl.textContent = "…";
    const text = await askOpenAI(key, dataUrl);

    lastAnswer = text;
    answerEl.textContent = text + "\n\n(공백 포함 " + text.length.toLocaleString() + "자)";
    loadText(text);
    playFrom(0);
  } catch (err) {
    answerEl.textContent = "";
    const m = describeError(err);
    reportError(m.screen, m.voice);
  }
});

// ---------- 이미지 축소 ----------
function resizeToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        let { width: w, height: h } = img;
        const scale = Math.min(1, MAX_SIDE / Math.max(w, h));
        w = Math.round(w * scale);
        h = Math.round(h * scale);
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", JPEG_QUALITY));
      } catch (e) { reject(e); }
      finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("IMAGE_LOAD")); };
    img.src = url;
  });
}

// ---------- OpenAI 호출 (Responses API) ----------
async function askOpenAI(key, dataUrl) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), TIMEOUT_MS);
  let res;
  try {
    res = await fetch("https://api.openai.com/v1/responses", {
      method: "POST",
      signal: controller.signal,
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + key,
      },
      body: JSON.stringify({
        model: MODEL,
        instructions: SYSTEM_PROMPT,
        max_output_tokens: MAX_OUTPUT_TOKENS,
        reasoning: { effort: REASONING_EFFORT },
        store: false,
        input: [{
          role: "user",
          content: [
            { type: "input_text", text: USER_PROMPT },
            { type: "input_image", image_url: dataUrl, detail: "high" },
          ],
        }],
      }),
    });
  } finally {
    clearTimeout(timer);
  }

  if (!res.ok) {
    let apiMsg = "";
    try { apiMsg = (await res.json())?.error?.message || ""; } catch {}
    const err = new Error("HTTP");
    err.status = res.status;
    err.apiMsg = apiMsg;
    throw err;
  }

  const data = await res.json();
  const text = extractText(data);
  if (!text) throw new Error("EMPTY");
  return text;
}

function extractText(data) {
  if (typeof data.output_text === "string" && data.output_text.trim()) return data.output_text.trim();
  const parts = [];
  for (const item of data.output || []) {
    if (item.type !== "message") continue;
    for (const c of item.content || []) {
      if (c.type === "output_text" && c.text) parts.push(c.text);
    }
  }
  return parts.join(" ").trim();
}

function describeError(err) {
  if (err.name === "AbortError")
    return { screen: "시간 초과 (" + TIMEOUT_MS / 1000 + "초)", voice: "응답 시간이 초과되었습니다. 다시 시도해 주세요." };
  if (err.message === "IMAGE_LOAD")
    return { screen: "사진을 읽을 수 없습니다", voice: "사진을 읽을 수 없습니다. 다시 찍어 주세요." };
  if (err.message === "EMPTY")
    return { screen: "AI 답변이 비어 있습니다", voice: "답변을 받지 못했습니다. 다시 시도해 주세요." };
  if (err.status === 401)
    return { screen: "401 인증 실패 - API 키를 확인하세요", voice: "API 키가 올바르지 않습니다. 키를 다시 확인해 주세요." };
  if (err.status === 429)
    return { screen: "429 요청 한도 초과 또는 잔액 부족" + (err.apiMsg ? "\n" + err.apiMsg : ""), voice: "요청 한도를 초과했거나 잔액이 부족합니다." };
  if (err.status)
    return { screen: "서버 오류 " + err.status + (err.apiMsg ? "\n" + err.apiMsg : ""), voice: "서버 오류가 발생했습니다." };
  // fetch 자체 실패 (TypeError) = 네트워크
  return { screen: "네트워크 오류 - 인터넷 연결을 확인하세요", voice: "네트워크 오류입니다. 인터넷 연결을 확인해 주세요." };
}
